<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurelia | Contact</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">AURELIA</div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="arrivals.html">New Arrivals</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- HAMBURGER -->
    <div class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

</header>

<!-- CONTACT HERO -->
<section class="contact-hero">

    <h1>Get In Touch</h1>
    <p>We would love to hear from you</p>

</section>

<!-- CONTACT SECTION -->
<section class="contact-section">

    <div class="contact-container">

        <!-- FORM -->
        <div class="contact-form">

            <h2>Send a Message</h2>

            <form>

                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <textarea placeholder="Your Message" rows="6" required></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

        <!-- INFO -->
        <div class="contact-info">

            <h2>Contact Info</h2>

            <p><strong>Email:</strong> support@aurelia.com</p>
            <p><strong>Phone:</strong> +234 800 000 0000</p>
            <p><strong>Location:</strong> Lagos, Nigeria</p>

            <div class="socials">
                <p>Follow Us:</p>
                <a href="#">Instagram</a>
                <a href="#">Pinterest</a>
                <a href="#">Facebook</a>
            </div>

        </div>

    </div>

</section>

<!-- FOOTER -->
<footer>
    <div class="footer-logo">AURELIA</div>
    <p>Luxury Redefined</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
